# Judge0 configuration for local development.
#
# Matches the services in docker-compose.yml. Do not reuse these credentials
# anywhere that is reachable from a network — they are deliberately boring
# defaults for a container that only listens on localhost.

# Database
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

# Redis
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0

# Execution limits. These are the ceiling; each submission also sends its own
# cpu_time_limit and memory_limit, which NextStep sets in RUN_LIMITS.
MAX_CPU_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=60
ALLOW_ENABLE_NETWORK=false

# Authentication. Leave empty for local use; set both and copy the token into
# CODE_RUNNER_TOKEN before exposing the runner to anything but localhost.
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=
